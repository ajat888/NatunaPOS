<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NatunaPOS Notifikasi</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px; background: #fff; color: #0F4C81; }
    h3 { margin-top: 0; }
    input, button { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #0F4C81; color: #fff; border: none; }
    #status { margin-top: 16px; white-space: pre-wrap; font-size: 14px; }
  </style>
</head>
<body>
  <h3>Aktifkan notifikasi</h3>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="enable">Aktifkan di HP ini</button>
  <div id="status"></div>
  <script>
    const statusEl = document.getElementById('status');
    const log = (m) => { statusEl.textContent += m + '\n'; };

    const b64ToU8 = (b64) => {
      const pad = '='.repeat((4 - b64.length % 4) % 4);
      const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
      return Uint8Array.from(raw, c => c.charCodeAt(0));
    };

    const run = async () => {
      statusEl.textContent = '';
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        log('Browser ini tidak mendukung Web Push.');
        return;
      }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        log('Izin notifikasi ditolak: ' + perm);
        return;
      }
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const cfg = await (await fetch('/api/push_config')).json();
      const tok = await fetch(cfg.supabase_url + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { 'apikey': cfg.supabase_anon_key, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      if (!tok.ok) {
        log('Login gagal.');
        return;
      }
      const tokJson = await tok.json();
      const reg = await navigator.serviceWorker.register('/push/sw.js', { scope: '/push/' });
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64ToU8(cfg.vapid_public_key)
      });
      const res = await fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + tokJson.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: sub.toJSON() })
      });
      log(res.ok ? 'Langganan tersimpan.' : 'Gagal menyimpan langganan: ' + res.status);
    };

    document.getElementById('enable').addEventListener('click', () => {
      run().catch(e => log('Error: ' + e.message));
    });
  </script>
</body>
</html>
